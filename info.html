<html lang="es">
<head>

    <title>Mecánica Coliseo</title>
    <style>

    <div class="image-container">
        <!-- Volver lleva a Inicio -->

        <!-- Continuar lleva a Puertas -->
        <a href="puertas.html"><div id="btn-continuar" class="invisible-btn"></div></a>
    </div>
</body>
</html>
