<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puertas Coliseo</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; display: flex; justify-content: center; }
        .image-container { position: relative; width: 100%; max-width: 450px; height: 100vh; background-image: url('puertas.png'); background-size: cover; background-position: center top; background-repeat: no-repeat; }
        .invisible-btn { position: absolute; cursor: pointer; background-color: rgba(0, 255, 255, 0.0); }
        
        #btn-arena { bottom: 35%; left: 38%; width: 24%; height: 18%; }
        #btn-elegancia { top: 21%; left: 4%; width: 28%; height: 6%; }
        #btn-carwash   { top: 43%; left: 4%; width: 28%; height: 6%; }
        #btn-drink     { top: 68%; left: 4%; width: 28%; height: 6%; }
        #btn-tv        { top: 21%; right: 4%; width: 28%; height: 6%; }
        #btn-somos     { top: 43%; right: 4%; width: 28%; height: 6%; }
        #btn-sinpelo   { top: 68%; right: 4%; width: 28%; height: 6%; }
        #btn-volver-inicio { bottom: 12%; left: 5%; width: 45%; height: 7%; }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- Regresa al inicio -->
        <a href="index.html"><div id="btn-volver-inicio" class="invisible-btn"></div></a>
        
        <!-- Alertas de navegacion interactiva -->
        <div id="btn-arena" class="invisible-btn" onclick="alert('Entrando al Coliseo Topo Point')"></div>
        <div id="btn-elegancia" class="invisible-btn" onclick="alert('Elegancia Barrial')"></div>
        <div id="btn-carwash" class="invisible-btn" onclick="alert('Car Wash')"></div>
        <div id="btn-drink" class="invisible-btn" onclick="alert('Drink de Topo')"></div>
        <div id="btn-tv" class="invisible-btn" onclick="alert('TV Estudios')"></div>
        <div id="btn-somos" class="invisible-btn" onclick="alert('Somos Topo Point')"></div>
        <div id="btn-sinpelo" class="invisible-btn" onclick="alert('Sin Pelo en la Lengua')"></div>
    </div>
</body>
</html>
