<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coliseo Topo Point - Puertas</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --dark-bg: #050505;
            --stone-color: #2a2a2a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace; /* O una fuente más similar a la imagen si la tienes */
            color: white;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        /* Contenedor principal con relación de aspecto 9:16 */
        .app-container {
            width: 100%;
            max-width: 450px; /* Limita el ancho en pantallas grandes para mantener formato móvil */
            height: 100vh;
            min-height: 800px; /* Asegura un alto mínimo para el aspecto 9:16 */
            position: relative;
            background-image: url('URL_DE_TU_IMAGEN_DE_FONDO'); /* REEMPLAZA ESTO CON LA URL DE LA IMAGEN DE FONDO SIN LOS LETREROS */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Si no tienes la imagen de fondo limpia, usaremos un color oscuro simulado */
        .app-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header / Título Principal */
        .header {
            text-align: center;
            margin-top: 10%;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        .header h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 1px var(--neon-blue);
        }

        .subtitle {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        
        .gladiadores-text {
            text-align: center;
            margin-top: 10px;
            font-size: 1.2rem;
            color: white;
            text-shadow: 0 0 5px white;
        }

        /* Contenedor de las Puertas/Botones */
        .doors-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex-grow: 1;
            padding: 10% 5%;
            position: relative;
        }

        /* Layout de columnas para los botones */
        .doors-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100%;
            align-items: center;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 40px; /* Espacio entre botones verticales */
        }

        /* Estilo base para los botones neón */
        .neon-button {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 0 10px var(--neon-blue) inset, 0 0 10px var(--neon-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            word-wrap: break-word; /* Permite que el texto largo salte de línea */
        }

        .neon-button:hover, .neon-button:active {
            background-color: var(--neon-blue);
            color: white;
            box-shadow: 0 0 20px var(--neon-blue) inset, 0 0 20px var(--neon-blue);
            transform: scale(1.05);
        }

        /* Botón de la puerta central (Coliseo) */
        .center-door-btn {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            width: 100px;
            height: 150px;
            /* Aquí podrías poner un div transparente sobre el área de la puerta central */
        }

        /* Estandartes Sociales y Footer */
        .footer-section {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 20px;
        }

        .social-banners, .info-banner {
            border: 1px solid var(--neon-blue);
            padding: 10px;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 5px var(--neon-blue) inset;
            text-align: center;
        }

        .social-banners {
            flex: 2;
            margin-right: 10px;
        }

        .social-title {
            color: var(--neon-blue);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .social-icons {
            display: flex;
            justify-content: space-around;
            color: var(--neon-blue);
            font-size: 1.2rem;
        }

        .info-banner {
            flex: 1;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #ddd;
        }

        /* Ajustes específicos de posición basados en la imagen */
        .btn-elegancia { margin-left: -10px; }
        .btn-tv { margin-right: -10px; }
        .btn-carwash { margin-left: -10px; }
        .btn-somos { margin-right: -10px; }
        .btn-drink { margin-left: -10px; }
        .btn-sinpelo { margin-right: -10px; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="content-layer">
            
            <header class="header">
                <h1>COLISEO</h1>
                <h1>TOPO POINT</h1>
                <div class="gladiadores-text">AQUÍ LOS PARTICIPANTES<br>SON LOS<br><strong>GLADIADORES</strong></div>
            </header>

            <div class="doors-container">
                <div class="doors-layout">
                    <!-- Columna Izquierda -->
                    <div class="column">
                        <button class="neon-button btn-elegancia" onclick="navigate('elegancia')">ELEGANCIA<br>BARRIAL</button>
                        <button class="neon-button btn-carwash" onclick="navigate('carwash')">CAR WASH<br>TOPO POINT</button>
                        <button class="neon-button btn-drink" onclick="navigate('drink')">DRINK<br>DE TOPO</button>
                    </div>

                    <!-- Columna Derecha -->
                    <div class="column">
                        <button class="neon-button btn-tv" onclick="navigate('tv')">TOPO POINT TV<br>ESTUDIOS</button>
                        <button class="neon-button btn-somos" onclick="navigate('somos')">SOMOS<br>TOPO POINT</button>
                        <button class="neon-button btn-sinpelo" onclick="navigate('sinpelo')">SIN PELO<br>EN LA LENGUA</button>
                    </div>
                </div>
                
                <!-- Área clickeable para la puerta central del coliseo -->
                <div class="center-door-btn" onclick="navigate('arena')" title="Entrar a la Arena"></div>
            </div>

            <div class="footer-section">
                <div class="social-banners">
                    <div class="social-title">ESTANDARTES SOCIALES</div>
                    <div class="social-icons">
                        <span>📸</span> <!-- Instagram -->
                        <span>▶️</span> <!-- YouTube -->
                        <span>🎵</span> <!-- TikTok -->
                        <span>f</span>  <!-- Facebook -->
                        <span>𝕏</span>  <!-- X (Twitter) -->
                        <span>💬</span> <!-- WhatsApp -->
                    </div>
                    <div style="font-size: 0.6rem; color: #888; margin-top: 5px;">TOCA UN ESTANDARTE PARA CONECTAR</div>
                </div>
                
                <div class="info-banner">
                    LA CALLE ES TUYA.<br>
                    EL COLISEO TE ESPERA.
                </div>
            </div>

        </div>
    </div>

    <script>
        // Función para manejar la navegación de los botones
        function navigate(section) {
            console.log("Navegando a la sección:", section);
            // Aquí puedes reemplazar los alert con las URLs reales de cada sección
            switch(section) {
                case 'elegancia':
                    alert("Accediendo a Elegancia Barrial...");
                    // window.location.href = '/ruta-elegancia';
                    break;
                case 'carwash':
                    alert("Accediendo a Car Wash Topo Point...");
                    // window.location.href = '/ruta-carwash';
                    break;
                case 'drink':
                    alert("Accediendo a Drink de Topo...");
                    // window.location.href = '/ruta-drink';
                    break;
                case 'tv':
                    alert("Accediendo a Topo Point TV Estudios...");
                    // window.location.href = '/ruta-tv';
                    break;
                case 'somos':
                    alert("Accediendo a Somos Topo Point...");
                    // window.location.href = '/ruta-somos';
                    break;
                case 'sinpelo':
                    alert("Accediendo a Sin Pelo en la Lengua...");
                    // window.location.href = '/ruta-sinpelo';
                    break;
                case 'arena':
                    alert("¡Entrando a la Arena de Gladiadores!");
                    // window.location.href = '/ruta-arena';
                    break;
                default:
                    console.log("Sección desconocida");
            }
        }
    </script>
</body>
</html>
